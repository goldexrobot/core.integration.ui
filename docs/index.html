<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>UI API</title>
</head>

<body>
	<div id="app"></div>
	<script>
		function init() {
			Scalar.createApiReference('#app', {
				sources: [
					{
						title: 'Bot: Customer API',
						url: './bot-customer-api.json',
						default: true,
					},
					{
						title: 'Vending: Customer API',
						url: './vending-customer-api.json'
					},
					{
						title: 'Bot: Collector API',
						url: './bot-collector-api.json'
					},
					{
						title: 'Vending: Collector API',
						url: './vending-collector-api.json'
					}
				],
				defaultOpenAllTags: true,
				layout: 'classic',
				telemetry: false,
				hideTestRequestButton: true,
				modelsSectionLabel: 'Schemas',
				expandAllSchemaProperties: true,
				defaultRequestBodyView: 'raw',
			})
		}
	</script>
	<script src="./scalar-standalone.js" onload="init()"></script>
</body>

</html>
